import numpy as np
import matplotlib.pyplot as plt
import matplotlib.animation as animation

# シミュレーションパラメータ
room_width = 6.3  # m（長辺）
room_height = 3.6  # m（短辺）
resolution = 0.1  # m（10cm）

nx = int(room_width / resolution)
ny = int(room_height / resolution)

dx = dy = resolution
dt = 30  # 秒（シミュレーションステップ）

steps = int((30 * 60) / dt)  # 30分間、30秒ステップで

alpha = 1.9e-5  # 空気の熱拡散率（m^2/s）

# 初期温度
T = np.full((ny, nx), 30.0)  # 全体を30℃で初期化

# エアコン位置（長辺の中央上部）
ac_x = nx // 2
ac_y = 0  # 天井付近を最上段とする（Y=0）

# 冷却条件
cooling_area_angle_deg = 30
cooling_radius_cells = int(2 / (dx * (dt)))  # 2m/s なので1ステップあたり2mの範囲

# 描画設定
fig, ax = plt.subplots()
img = ax.imshow(T, cmap='coolwarm', vmin=18, vmax=32, origin='lower', extent=[0, room_width, 0, room_height])
fig.colorbar(img, label='Temperature (°C)')

def apply_cooling(T):
    # エアコン前方扇形領域に冷却を加える
    for r in range(1, cooling_radius_cells):
        for angle_deg in range(-cooling_area_angle_deg // 2, cooling_area_angle_deg // 2 + 1):
            angle_rad = np.radians(angle_deg)
            dx_ = int(round(r * np.sin(angle_rad)))
            dy_ = int(round(r * np.cos(angle_rad)))
            x = ac_x + dx_
            y = ac_y + dy_

            if 0 <= x < nx and 0 <= y < ny:
                # 冷却効果を段階的に加える（距離減衰）
                T[y, x] -= 0.2  # 単純な冷却（高度な熱力学処理は省略）

    return T

def update(frame):
    global T
    T_new = T.copy()
    
    # 拡散（離散版2Dラプラシアン）
    T_new[1:-1, 1:-1] = T[1:-1, 1:-1] + alpha * dt * (
        (T[2:, 1:-1] - 2 * T[1:-1, 1:-1] + T[:-2, 1:-1]) / dx**2 +
        (T[1:-1, 2:] - 2 * T[1:-1, 1:-1] + T[1:-1, :-2]) / dy**2
    )

    # エアコンの冷却を適用
    T_new = apply_cooling(T_new)

    # 温度が20度未満にならないように制限（現実的条件）
    T_new = np.clip(T_new, 20.0, 100.0)

    T = T_new

    img.set_array(T)
    ax.set_title(f"Time: {frame * dt // 60} min")
    return [img]

ani = animation.FuncAnimation(fig, update, frames=steps, blit=False, interval=100)

plt.xlabel("Width (m)")
plt.ylabel("Height (m)")
plt.title("2D Room Temperature Simulation")
plt.show()